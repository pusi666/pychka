<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>I love you</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: rgb(40, 0, 10); /* Твой цвет фона */
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            overflow: hidden;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>

<canvas id="heartCanvas"></canvas>

<script>
    const canvas = document.getElementById('heartCanvas');
    const ctx = canvas.getContext('2d');

    // --- НАСТРОЙКИ (взяты из твоего Python кода) ---
    const WIDTH = 900;
    const HEIGHT = 700;
    const BG_COLOR = "rgb(40, 0, 10)";
    const TEXT_COLOR = "rgb(255, 255, 255)";
    const FPS = 60;
    const TEXT = "I love you ";
    const FONT_SIZE = 20;
    const POINTS_PER_HEART = 200;
    const NUM_HEARTS = 3;
    const DRAW_SECONDS = 10.0;
    const SHRINK_STEP = 0.20;
    const BASE_SCALE = 0.65;

    // Подгоняем размер холста под экран телефона/компьютера
    function resizeCanvas() {
        const scale = Math.min(window.innerWidth / WIDTH, window.innerHeight / HEIGHT);
        canvas.width = WIDTH;
        canvas.height = HEIGHT;
        canvas.style.width = WIDTH * scale + 'px';
        canvas.style.height = HEIGHT * scale + 'px';
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    function heartPoint(t) {
        let x = 16 * Math.pow(Math.sin(t), 3);
        let y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
        return {x: x, y: y};
    }

    function buildHeartPoints(n, scale_mul) {
        let raw = [];
        for (let i = 0; i < n; i++) {
            let t = 2 * Math.PI * i / n;
            raw.push(heartPoint(t));
        }

        let xs = raw.map(p => p.x);
        let ys = raw.map(p => p.y);
        let min_x = Math.min(...xs), max_x = Math.max(...xs);
        let min_y = Math.min(...ys), max_y = Math.max(...ys);

        let margin = 50;
        let scale = Math.min(
            (WIDTH - 2 * margin) / (max_x - min_x),
            (HEIGHT - 2 * margin) / (max_y - min_y)
        ) * BASE_SCALE * scale_mul;

        let cx = WIDTH / 2, cy = HEIGHT / 2;
        let result = [];
        for (let p of raw) {
            let px = cx + (p.x - (min_x + max_x) / 2) * scale;
            let py = cy - (p.y - (min_y + max_y) / 2) * scale;
            result.push({x: px, y: py});
        }
        return result;
    }

    let HEARTS = [];
    for (let i = 0; i < NUM_HEARTS; i++) {
        HEARTS.push(buildHeartPoints(POINTS_PER_HEART, 1.0 + SHRINK_STEP * i));
    }

    function drawHeart(points, drawn_count, offset) {
        let limit = Math.min(Math.floor(drawn_count), points.length);
        ctx.font = `bold ${FONT_SIZE}px Arial`;
        ctx.fillStyle = TEXT_COLOR;
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";

        for (let i = 0; i < limit; i++) {
            let px = points[i].x;
            let py = points[i].y;
            let ch = TEXT[(i + offset) % TEXT.length];
            if (ch === " ") continue;
            ctx.fillText(ch, px, py);
        }
    }

    let total = HEARTS[0].length;
    let speed = total / (DRAW_SECONDS * FPS);
    let current_heart = 0;
    let progress = 0.0;
    let offset = 0;

    function animate() {
        ctx.fillStyle = BG_COLOR;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);

        for (let h = 0; h < current_heart; h++) {
            drawHeart(HEARTS[h], HEARTS[h].length, 0);
        }

        if (current_heart < NUM_HEARTS) {
            progress += speed;
            if (progress >= total) {
                progress = total;
                drawHeart(HEARTS[current_heart], total, 0);
                current_heart++;
                progress = 0.0;
                offset = 0;
            } else {
                offset = Math.floor(progress) % TEXT.length;
                drawHeart(HEARTS[current_heart], progress, offset);
            }
        }

        requestAnimationFrame(animate);
    }

    animate();
</script>
</body>
</html>
